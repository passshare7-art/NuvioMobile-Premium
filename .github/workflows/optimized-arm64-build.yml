name: Optimized ARM64 APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: optimized-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  optimized-apk:
    name: Build optimized ARM64 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Prepare runtime properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.NUVIO_LOCAL_PROPERTIES_BASE64 }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
            sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties
          else
            touch local.properties
          fi

      - name: Build optimized benchmark APKs
        run: ./gradlew :androidApp:assembleFullBenchmark -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore --stacktrace

      - name: Upload optimized APKs
        uses: actions/upload-artifact@v7
        with:
          name: Nuvio-optimized-ARM64
          path: androidApp/build/outputs/apk/full/benchmark/*.apk
          if-no-files-found: error
          retention-days: 7
